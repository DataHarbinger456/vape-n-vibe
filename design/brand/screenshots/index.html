<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vaper: new icon, installer and app</title>
    <style>
      body {
        margin: 0;
        padding: 40px;
        background: #0b0b0c;
        color: #c7c7cc;
        font:
          14px/1.5 -apple-system,
          "Segoe UI",
          sans-serif;
      }
      h1 {
        margin: 0 0 24px;
        color: #f2f2f3;
        font-size: 22px;
      }
      .grid {
        display: grid;
        grid-template-columns: 340px 400px;
        gap: 32px;
        align-items: start;
      }
      figure {
        margin: 0 0 32px;
      }
      figcaption {
        margin-top: 8px;
        color: #98989f;
      }
      img {
        display: block;
        max-width: 100%;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Vaper: new icon, installer and app</h1>
    <figure>
      <img
        src="dmg-installer.png"
        width="660"
        alt="DMG installer window: Vaper wordmark, tagline, the chrome-droplet app icon with mercury beads hopping to the Applications folder, and the line Drag Vaper into Applications, then hold fn and talk"
      />
      <figcaption>
        DMG installer, real Finder window from a local unsigned build
      </figcaption>
    </figure>
    <div class="grid">
      <figure>
        <img
          src="app-icon.png"
          width="340"
          alt="App icon: a chrome liquid-metal droplet mid-splash over a red on-air glow"
        />
        <figcaption>App icon</figcaption>
      </figure>
      <figure>
        <img
          src="settings-window.png"
          width="400"
          alt="Settings window running in Electron"
        />
        <figcaption>Settings window, running app</figcaption>
      </figure>
    </div>
    <figure>
      <img
        src="dock.png"
        width="340"
        alt="Dock: old installed Vaper icon on the left, new icon on the running build on the right"
      />
      <figcaption>
        Dock: the old installed release (left) next to the new build (right)
      </figcaption>
    </figure>
    <figure>
      <img
        src="menu-bar.png"
        width="380"
        alt="Menu bar with the new splash glyph"
      />
      <figcaption>Menu bar glyph</figcaption>
    </figure>
  </body>
</html>
